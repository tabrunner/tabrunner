<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>TabRunner</title>
    <!-- First-paint theme + boot cover, inline so it applies before any bundle
         loads. Backgrounds mirror the app shell (bg-white / dark:bg-neutral-950);
         the OS scheme decides pre-JS, the `dark` class (initTheme, pre-render)
         takes over the instant it lands. A stored theme forced against the OS
         shows the OS shade for those few ms — the app repaints over it.
         The mark waits 150ms before fading in, so a warm load never flashes it,
         and breathes while it's up so a slow one reads as starting, not hung.
         Past 4s it says so in words, past 15s it offers a way out, and a load
         that fails says that and stops breathing — shell.ts owns the timeline.

         It lives OUTSIDE #root, opaque, and the app removes it (App.tsx) only
         once there is something true to show. Inside #root it was torn down by
         React's own container clear at mount — which is the beat BEFORE the
         provider read and the transcript read land, so the panel dropped its
         one honest "starting" signal and spent the rest of the boot showing an
         empty shell, then the "nothing here yet" hero, then yesterday's chat.
         One state, held, is worth more than three that are each briefly a lie. -->
    <style>
      html,
      #boot {
        background: #fff;
      }
      /* #070b16 is neutral-950 as theme.css retints it. It used to be #0a0a0a —
         Tailwind's stock neutral-950, left behind by the deep-field retint — so
         the boot screen flashed a flatter, warmer dark than the app painted over
         it. A runtime copy of a token, like the injected page CSS keeps. */
      @media (prefers-color-scheme: dark) {
        html,
        #boot {
          background: #070b16;
        }
      }
      html.dark,
      html.dark #boot {
        background: #070b16;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        /* Above the mounted app: React renders the real panel underneath while
           the cover is still up, so the first thing seen is the finished thing. */
        z-index: 1;
      }
      /* Lifted when the panel has real content. The node removes itself on
         transitionend — no duplicated duration in the TSX. */
      #boot.done {
        opacity: 0;
        transition: opacity 180ms ease-out;
        pointer-events: none;
      }
      #boot img {
        width: 40px;
        height: 40px;
        opacity: 0;
        /* Ramps in rather than appearing. The cover now outlives React's mount,
           so a hard 150ms threshold would let an open that finishes around
           300ms show a fully drawn mark for a single beat — a flash, which is
           what the delay existed to prevent. The ramp makes the mark's presence
           proportional to the wait: nothing under ~200ms, unmistakable past
           half a second. It hands off to the breathe at its own value. */
        animation:
          boot-in 400ms ease-in 0.15s forwards,
          boot-breathe 1.6s ease-in-out 0.55s infinite alternate;
      }
      @keyframes boot-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 0.35;
        }
      }
      @keyframes boot-breathe {
        from {
          opacity: 0.35;
        }
        to {
          opacity: 1;
        }
      }
      /* The mark starts at opacity 0 and is made visible BY the animation, so
         plain `animation: none` here would hide it outright. One pass of the
         same keyframe, held — the 150ms delay stays, so a warm load still never
         flashes it; it just doesn't breathe. */
      @media (prefers-reduced-motion: reduce) {
        #boot img {
          animation: boot-breathe 300ms ease-out 0.15s forwards;
        }
      }
      /* Glow means live: a load that failed is not working on anything, so the
         mark stops breathing and rests at the value it breathes from. */
      #boot[data-state="failed"] img {
        animation: none;
        opacity: 0.35;
      }

      /* The words, hung below the mark so it never moves when they arrive. No
         Tailwind yet — the app's CSS loads with the app — so these are the
         theme.css tokens by value: neutral-500/700 light, neutral-400/200 dark,
         the primary Button in brand-500 on brand-950. */
      .boot-mark {
        position: relative;
        display: grid;
      }
      .boot-words {
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        width: 260px;
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        text-align: center;
        font:
          13px/1.45 ui-sans-serif,
          system-ui,
          sans-serif;
        color: #5d6d92;
        opacity: 0;
        transition: opacity 200ms ease-out;
      }
      #boot[data-state] .boot-words {
        opacity: 1;
      }
      .boot-words p {
        margin: 0;
        text-wrap: balance;
      }
      .boot-words p:empty {
        display: none;
      }
      #boot:is([data-state="stuck"], [data-state="failed"]) #boot-message {
        color: #25325c;
        font-weight: 500;
      }
      #boot-retry {
        margin-top: 12px;
        padding: 8px 12px;
        border: 0;
        border-radius: 8px;
        background: #10b981;
        color: #022c22;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      #boot-retry:hover {
        background: #059669;
      }
      #boot-retry:focus-visible {
        outline: 2px solid #10b981;
        outline-offset: 2px;
      }
      @media (prefers-color-scheme: dark) {
        .boot-words {
          color: #8797ba;
        }
        #boot:is([data-state="stuck"], [data-state="failed"]) #boot-message {
          color: #d5deef;
        }
      }
      html.dark .boot-words {
        color: #8797ba;
      }
      html.dark #boot:is([data-state="stuck"], [data-state="failed"]) #boot-message {
        color: #d5deef;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-words {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">
      <div class="boot-mark">
        <img src="/icon.svg" alt="" />
        <div class="boot-words">
          <div role="status">
            <p id="boot-message"></p>
            <p id="boot-hint"></p>
          </div>
          <button id="boot-retry" type="button" hidden></button>
        </div>
      </div>
    </div>
    <!-- The shell, not the app: the panel stays hidden until this page's first
         load finishes, so the app loads after it (see shell.ts). -->
    <script type="module" src="./shell.ts"></script>
  </body>
</html>
