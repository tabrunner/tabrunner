name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      # The keyed zip — the website's install (loaded unpacked) and the same file
      # that goes to the Chrome Web Store by hand. One artifact, every channel.
      - run: bun run zip
      # The single-file MCP daemon: what docs/mcp.md's manual setup fetches.
      - run: bun run bridge:bundle
      # Versioned names are the permanent record; the `latest` aliases give
      # tabrunner.app stable hotlinks (`releases/latest/download/<alias>`) that
      # never need a site deploy when a version ships.
      - name: Stable download aliases for tabrunner.app
        run: |
          cp dist/tabrunner-*-chrome.zip dist/tabrunner-latest-chrome.zip
          cp dist/tabrunner-*-mcp.js dist/tabrunner-latest-mcp.js
      # Permanent record of the version's artifacts — public download links on
      # the tagged GitHub Release, with auto-generated notes. The CWS dashboard
      # itself never exposes a shareable artifact, so this is the storage seam.
      - name: Attach artifacts to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tabrunner-*.zip
            dist/tabrunner-*.js
          generate_release_notes: true
      # The same daemon as the npm package `tabrunner-mcp`: what the plugin's server runs
      # (`bunx tabrunner-mcp@<version>`). NPM_TOKEN is a publish token for the package, and
      # `prepack` builds the bundle. After the release assets, so a refused publish never holds
      # them back.
      - name: Publish the daemon to npm
        working-directory: daemon
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # The MCP Registry entry pins the package version just published, and the registry refuses
      # one npm doesn't serve yet: a new version can take a minute to appear. MCP_REGISTRY_KEY
      # signs for the tabrunner.app namespace, whose TXT record holds the public half.
      - name: Publish the MCP Registry entry
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
          MCP_PUBLISHER: https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1
        run: |
          set -euo pipefail
          version=$(jq -r .version daemon/package.json)
          for try in $(seq 1 30); do
            curl -fsS -o /dev/null "https://registry.npmjs.org/tabrunner-mcp/$version" && break
            if [ "$try" = 30 ]; then echo "::error::npm never served tabrunner-mcp@$version"; exit 1; fi
            sleep 10
          done
          arch=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          curl -fsSL "$MCP_PUBLISHER/mcp-publisher_linux_$arch.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login dns --domain tabrunner.app --private-key "$MCP_REGISTRY_KEY"
          ./mcp-publisher publish daemon/server.json
